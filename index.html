<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observatorio Global de Inteligencias Artificiales</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-emerald-50 min-h-screen font-sans">

  <!-- Encabezado principal -->
  <header class="border-b border-emerald-900/60 bg-slate-950/90 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 via-teal-300 to-green-500 bg-clip-text text-transparent">
          Ecosistema Global de IA
        </h1>
        <p class="text-emerald-400/80 text-sm mt-1">
          Análisis de accesibilidad, gobernanza estatal, valor de mercado, licencias y enfoque académico.
        </p>
      </div>
      <!-- Barra de Búsqueda -->
      <div class="relative w-full md:w-72">
        <input type="text" id="searchInput" placeholder="Buscar IA, empresa o país..." 
               class="w-full bg-slate-900 text-emerald-100 border border-emerald-800/80 rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 placeholder-emerald-700">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-emerald-500"></i>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <!-- Panel de Filtros -->
    <div class="bg-slate-900/70 border border-emerald-800/60 rounded-xl p-4 mb-8 flex flex-wrap gap-4 items-center shadow-lg shadow-emerald-950/20">
      <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400 flex items-center gap-1">
        <i data-lucide="filter" class="w-4 h-4"></i> Filtrar por:
      </span>
      
      <!-- FILTRO: Categoría -->
      <select id="filterCategory" class="bg-slate-950 border border-emerald-500/60 text-emerald-300 rounded-md px-3 py-1.5 text-sm focus:ring-2 focus:ring-emerald-400 font-medium">
        <option value="all">Todas las categorías</option>
        <option value="Académica / Investigación">🎓 Académica y Búsqueda Científica</option>
        <option value="Laboratorio Universitario">🏛️ Laboratorio Universitario / Instituto</option>
        <option value="General / Comercial">💼 General y Comercial</option>
      </select>

      <!-- Filtro Entorno -->
      <select id="filterEnvironment" class="bg-slate-950 border border-emerald-800 rounded-md px-3 py-1.5 text-sm text-emerald-200 focus:ring-2 focus:ring-emerald-500">
        <option value="all">Todos los entornos</option>
        <option value="Abierto">Entorno Abierto (API/Web)</option>
        <option value="Cerrado">Entorno Cerrado / Restringido</option>
      </select>

      <!-- Filtro Licencia -->
      <select id="filterLicense" class="bg-slate-950 border border-emerald-800 rounded-md px-3 py-1.5 text-sm text-emerald-200 focus:ring-2 focus:ring-emerald-500">
        <option value="all">Todas las licencias</option>
        <option value="Código Abierto">Código Abierto / Pesos Abiertos</option>
        <option value="Propietario">Propietario</option>
      </select>

      <!-- Filtro País -->
      <select id="filterCountry" class="bg-slate-950 border border-emerald-800 rounded-md px-3 py-1.5 text-sm text-emerald-200 focus:ring-2 focus:ring-emerald-500">
        <option value="all">Todos los países</option>
        <option value="EE.UU.">Estados Unidos</option>
        <option value="China">China</option>
        <option value="Francia">Francia</option>
      </select>
    </div>

    <!-- Grilla de Tarjetas -->
    <div id="aiGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Se llena dinámicamente con JavaScript -->
    </div>
  </main>

  <!-- Lógica Interactiva con JS -->
  <script>
    const aiData = [
      // --- HERRAMIENTAS ACADÉMICAS Y CIENTÍFICAS ---
      {
        name: "NotebookLM",
        company: "Google / Alphabet",
        country: "EE.UU.",
        category: "Académica / Investigación",
        environment: "Abierto",
        license: "Propietario (Gratuito)",
        valuation: "$2.0T+ (Alphabet)",
        stateIntervention: "Sujeto a las políticas globales de privacidad y protección de datos académicos de Google.",
        notes: "Cuaderno de investigación impulsado por Gemini que analiza únicamente los documentos/PDFs cargados por el usuario y genera podcasts en audio."
      },
      {
        name: "Perplexity AI",
        company: "Perplexity AI, Inc.",
        country: "EE.UU.",
        category: "Académica / Investigación",
        environment: "Abierto",
        license: "Propietario (Motor Híbrido)",
        valuation: "$9B - $18B",
        stateIntervention: "Sujeta a disputas de derechos de autor con medios masivos y acuerdos de licenciamiento de contenido.",
        notes: "Buscador conversacional que cita fuentes en tiempo real; integra modelos como GPT-4o, Claude y Sonar."
      },
      {
        name: "SciSpace (Typeset)",
        company: "SciSpace",
        country: "EE.UU. / India",
        category: "Académica / Investigación",
        environment: "Abierto",
        license: "Propietario",
        valuation: "Startup (Financiación VC)",
        stateIntervention: "Cumplimiento de normativas de privacidad de datos académicos e integración con repositorios abiertos.",
        notes: "Plataforma para lectura, resumen y análisis de papers científicos en PDF con copiloto multilingüe."
      },
      {
        name: "Anara AI",
        company: "Anara",
        country: "EE.UU.",
        category: "Académica / Investigación",
        environment: "Abierto",
        license: "Propietario",
        valuation: "Startup (Etapa Temprana)",
        stateIntervention: "Centrado en estándares de integridad académica y protección de propiedad intelectual de investigadores.",
        notes: "Asistente especializado en síntesis de literatura académica, extracción de datos y mapeo de citas."
      },
      {
        name: "Paperguide",
        company: "Paperguide AI",
        country: "EE.UU.",
        category: "Académica / Investigación",
        environment: "Abierto",
        license: "Propietario",
        valuation: "Startup (Etapa Temprana)",
        stateIntervention: "Integración con bases de datos públicas de investigación y protocolos de citas estándar.",
        notes: "Gestor de referencias y asistente de escritura académica enfocado en revisión de literatura y redacción de tesis."
      },

      // --- MODELOS DE LABORATORIOS E INSTITUTOS ACADÉMICOS ---
      {
        name: "OLMo 2",
        company: "Allen Institute for AI (AI2)",
        country: "EE.UU.",
        category: "Laboratorio Universitario",
        environment: "Abierto",
        license: "Código Abierto (Open Source Real)",
        valuation: "Sin fines de lucro",
        stateIntervention: "Financiado parcialmente por becas de investigación académica (NSF) y fondos filantrópicos.",
        notes: "Open Source verdadero: incluye código, pesos, datos de entrenamiento completos y logs de optimización."
      },
      {
        name: "Alpaca / Vicuna",
        company: "Stanford University / LMSYS Org",
        country: "EE.UU.",
        category: "Laboratorio Universitario",
        environment: "Abierto",
        license: "Código Abierto (Investigación)",
        valuation: "Consorcio Universitario",
        stateIntervention: "Supervisión bajo comités de ética académica universitaria.",
        notes: "Pioneros en la democratización del ajuste fino (fine-tuning) en laboratorios universitarios."
      },
      {
        name: "Bloom / BigScience",
        company: "Consorcio BigScience (Hugging Face / CNRS)",
        country: "Francia",
        category: "Laboratorio Universitario",
        environment: "Abierto",
        license: "Código Abierto (RAIL License)",
        valuation: "Iniciativa Multilateral / Académica",
        stateIntervention: "Apoyado con supercomputación pública europea (supercomputador Jean Zay de Francia).",
        notes: "Primer gran modelo multilingüe creado de forma transparente por más de 1000 investigadores."
      },

      // --- GENERAL Y COMERCIAL ---
      {
        name: "Claude 3.7 Sonnet",
        company: "Anthropic",
        country: "EE.UU.",
        category: "General / Comercial",
        environment: "Abierto",
        license: "Propietario",
        valuation: "$60B+",
        stateIntervention: "Monitoreado por el US AISI; firma de compromisos de seguridad de la Casa Blanca.",
        notes: "Destacado por razonamiento híbrido y alineación de seguridad ('Constitutional AI')."
      },
      {
        name: "GPT-4o / O3-Mini",
        company: "OpenAI",
        country: "EE.UU.",
        category: "General / Comercial",
        environment: "Abierto",
        license: "Propietario",
        valuation: "$150B+",
        stateIntervention: "Supervisión de directivas ejecutivas de EE.UU. y acuerdos con el sector de defensa.",
        notes: "Líder global en consumo masivo comercializado junto a Microsoft."
      },
      {
        name: "Qwen 2.5 / Qwq",
        company: "Alibaba Cloud",
        country: "China",
        category: "General / Comercial",
        environment: "Abierto",
        license: "Código Abierto (Open Weights)",
        valuation: "$200B+ (Grupo Alibaba)",
        stateIntervention: "Regulado por la CAC (Administración del Ciberespacio de China) para alineación ideológica.",
        notes: "Familia de modelos muy potente y multilingüe, pilar del ecosistema de código abierto asiático."
      },
      {
        name: "Kimi K1.5",
        company: "Moonshot AI",
        country: "China",
        category: "General / Comercial",
        environment: "Abierto",
        license: "Propietario / Servicios API",
        valuation: "$3.3B+",
        stateIntervention: "Sujeto a las leyes de seguridad de datos y regulación de IA generativa de China.",
        notes: "Pionero en manejo masivo de contexto (millones de tokens) y razonamiento avanzado."
      },
      {
        name: "DeepSeek-V3 / R1",
        company: "DeepSeek",
        country: "China",
        category: "General / Comercial",
        environment: "Abierto",
        license: "Código Abierto (Open Weights)",
        valuation: "Privada (Respaldada por High-Flyer Quant)",
        stateIntervention: "Supervisión regulatoria estatal china y restricciones de exportación de hardware de EE.UU.",
        notes: "Revolucionó la arquitectura de bajo costo mediante entrenamiento por Aprendizaje por Refuerzo."
      }
    ];

    const aiGrid = document.getElementById('aiGrid');
    const searchInput = document.getElementById('searchInput');
    const filterCategory = document.getElementById('filterCategory');
    const filterEnvironment = document.getElementById('filterEnvironment');
    const filterLicense = document.getElementById('filterLicense');
    const filterCountry = document.getElementById('filterCountry');

    function renderCards(data) {
      aiGrid.innerHTML = '';
      if(data.length === 0) {
        aiGrid.innerHTML = `<p class="text-emerald-600 col-span-full text-center py-10">No se encontraron modelos con los filtros seleccionados.</p>`;
        return;
      }

      data.forEach(item => {
        const isOpenCode = item.license.includes("Código Abierto");
        const isAcademic = item.category === "Académica / Investigación" || item.category === "Laboratorio Universitario";

        const card = document.createElement('div');
        card.className = "bg-slate-900/90 border border-emerald-900/80 rounded-xl p-5 hover:border-emerald-500/70 transition duration-200 flex flex-col justify-between shadow-md hover:shadow-emerald-900/20";
        
        card.innerHTML = `
          <div>
            <div class="mb-2">
              <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded ${isAcademic ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-teal-500/20 text-teal-300 border border-teal-500/40'}">
                ${item.category}
              </span>
            </div>

            <div class="flex justify-between items-start gap-2 mb-3">
              <div>
                <h3 class="text-lg font-bold text-white">${item.name}</h3>
                <p class="text-sm text-emerald-400/80 font-medium">${item.company} • <span class="text-teal-300">${item.country}</span></p>
              </div>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${isOpenCode ? 'bg-emerald-400/10 text-emerald-300 border border-emerald-500/40' : 'bg-amber-400/10 text-amber-300 border border-amber-500/40'}">
                ${isOpenCode ? 'Código Abierto' : 'Propietario'}
              </span>
            </div>

            <div class="space-y-2 my-4 text-xs">
              <div class="flex justify-between py-1 border-b border-emerald-900/40">
                <span class="text-emerald-500/80">Entorno:</span>
                <span class="text-emerald-100 font-medium">${item.environment}</span>
              </div>
              <div class="flex justify-between py-1 border-b border-emerald-900/40">
                <span class="text-emerald-500/80">Valor / Financiación:</span>
                <span class="text-emerald-100 font-medium">${item.valuation}</span>
              </div>
            </div>

            <div class="mt-3">
              <p class="text-xs font-semibold text-emerald-300 mb-1">Gobernanza / Intervención Estatal:</p>
              <p class="text-xs text-emerald-200/70 bg-slate-950 p-2.5 rounded-lg border border-emerald-900/60">${item.stateIntervention}</p>
            </div>
          </div>

          <div class="mt-4 pt-3 border-t border-emerald-900/40">
            <p class="text-xs text-emerald-400/80 italic">"${item.notes}"</p>
          </div>
        `;
        aiGrid.appendChild(card);
      });

      lucide.createIcons();
    }

    function filterData() {
      const query = searchInput.value.toLowerCase();
      const cat = filterCategory.value;
      const env = filterEnvironment.value;
      const lic = filterLicense.value;
      const country = filterCountry.value;

      const filtered = aiData.filter(item => {
        const matchesQuery = item.name.toLowerCase().includes(query) || 
                             item.company.toLowerCase().includes(query) || 
                             item.country.toLowerCase().includes(query);
        const matchesCat = cat === 'all' || item.category === cat;
        const matchesEnv = env === 'all' || item.environment === env;
        const matchesLic = lic === 'all' || (lic === 'Código Abierto' ? item.license.includes('Código Abierto') : item.license.includes('Propietario'));
        const matchesCountry = country === 'all' || item.country.includes(country);

        return matchesQuery && matchesCat && matchesEnv && matchesLic && matchesCountry;
      });

      renderCards(filtered);
    }

    searchInput.addEventListener('input', filterData);
    filterCategory.addEventListener('change', filterData);
    filterEnvironment.addEventListener('change', filterData);
    filterLicense.addEventListener('change', filterData);
    filterCountry.addEventListener('change', filterData);

    renderCards(aiData);
  </script>
</body>
</html>
